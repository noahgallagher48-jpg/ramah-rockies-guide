<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ramah in the Rockies &middot; The Reel</title>
<meta property="og:title" content="Ramah in the Rockies &middot; The Reel">
<meta property="og:image" content="https://www.abba-photo.com/ramah-rockies-guide/first-look/img/og.jpg">
<style>
  :root{--bg:#0e0c0a;--ink:#ede7dd;--muted:#9a917f;--accent:#e2a73e}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Avenir Next","Avenir",system-ui,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage img{max-width:100vw;max-height:100vh;object-fit:contain;opacity:0;transition:opacity .22s ease}
  #stage img.on{opacity:1}
  .card{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:var(--bg);z-index:5;transition:opacity .5s ease}
  .card.off{opacity:0;pointer-events:none}
  .card h1{font-family:"Iowan Old Style",Georgia,serif;font-weight:600;font-size:clamp(26px,5vw,44px)}
  .card .sub{margin-top:14px;color:var(--muted);font-size:clamp(14px,2.4vw,17px)}
  .card .go{margin-top:38px;color:var(--accent);font-size:13px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;border:1px solid rgba(226,167,62,.45);padding:11px 22px;border-radius:3px;background:none;font-family:inherit}
  #exit{position:fixed;top:12px;left:14px;z-index:20;display:flex;align-items:center;gap:7px;
        font-size:12px;letter-spacing:.06em;color:var(--ink);text-decoration:none;
        background:rgba(14,12,10,.6);border:1px solid rgba(237,231,221,.28);backdrop-filter:blur(6px);
        padding:9px 15px 9px 12px;border-radius:999px;transition:background .2s,border-color .2s}
  #exit:hover{background:rgba(14,12,10,.9);border-color:rgba(237,231,221,.6)}
  #bar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;
       padding:14px 18px;z-index:6;font-size:12px;color:var(--muted);letter-spacing:.06em}
  #bar .n{font-variant-numeric:tabular-nums}
  .nav{position:fixed;top:0;bottom:0;width:34%;z-index:3;cursor:pointer;-webkit-tap-highlight-color:transparent}
  #prev{left:0}#next{right:0}
  @media (max-width:600px){#exit{font-size:11px;padding:8px 13px 8px 10px}}
</style>
</head>
<body>

<a id="exit" href="../">&#8592; Back to the guide</a>

<div class="card" id="title">
  <h1>Ramah in the Rockies</h1>
  <p class="sub">June 2026 &middot; thirty-two seconds, shuffled</p>
  <button class="go" id="start">Begin</button>
</div>

<div id="stage"><img id="imgA" alt=""><img id="imgB" alt="" style="position:absolute"></div>
<div class="nav" id="prev" aria-label="Previous"></div>
<div class="nav" id="next" aria-label="Next"></div>
<div id="bar">
  <span>Photographs by Noah Gallagher &middot; <a href="https://www.abba-photo.com" style="color:inherit">abba-photo.com</a></span>
  <span class="n" id="count"></span>
</div>

<script>
const N = 27, MS = 1200;
const ORDER = Array.from({length:N}, (_,k) => k+1);
for (let k = ORDER.length - 1; k > 0; k--) { const j = Math.floor(Math.random()*(k+1)); [ORDER[k],ORDER[j]] = [ORDER[j],ORDER[k]]; }
const src = n => "img/rr-" + String(ORDER[n-1]).padStart(2,"0") + ".jpg";
let i = 0, timer = null, showing = null;
const A = document.getElementById("imgA"), B = document.getElementById("imgB"), count = document.getElementById("count");
function preload(k){ if(k>=0 && k<N){ (new Image()).src = src(k+1); } }
function show(k){
  i = (k + N) % N;
  const inEl = showing === A ? B : A, outEl = showing === A ? A : B;
  inEl.onload = () => {
    outEl.classList.remove("on"); inEl.classList.add("on"); showing = inEl;
    count.textContent = (i+1) + " / " + N;
    preload(i+1); preload(i+2);
  };
  inEl.src = src(i+1);
}
function step(d){ show(i+d); }
function arm(){ clearInterval(timer); timer = setInterval(()=>step(1), MS); }
document.getElementById("start").onclick = () => {
  document.getElementById("title").classList.add("off"); show(0); arm();
};
document.getElementById("next").onclick = () => { step(1); arm(); };
document.getElementById("prev").onclick = () => { step(-1); arm(); };
document.addEventListener("keydown", e => {
  if(e.key==="ArrowRight"){ step(1); arm(); }
  if(e.key==="ArrowLeft"){ step(-1); arm(); }
  if(e.key==="Escape"){ clearInterval(timer); location.href = "../"; }
});
let tx=null, ty=null;
document.addEventListener("touchstart", e => { tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
document.addEventListener("touchend", e => {
  if(tx===null) return;
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)){ step(dx<0?1:-1); arm(); }
  else if(dy>70 && Math.abs(dy)>Math.abs(dx)){ clearInterval(timer); location.href="../"; }
  tx=null; ty=null;
}, {passive:true});
preload(0); preload(1);
</script>
</body>
</html>
